<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .custom-scroll::-webkit-scrollbar {
        width: 8px;
      }
      .custom-scroll::-webkit-scrollbar-track {
        background: #2d2d2d;
        border-radius: 100px;
      }
      .custom-scroll::-webkit-scrollbar-thumb {
        background-color: #555;
        border-radius: 100px;
        border: 2px solid #2d2d2d;
      }
      .tag {
        background-color: #4b5563;
        color: white;
        font-size: 0.75rem;
        padding: 0.25rem 0.5rem;
        border-radius: 0.375rem;
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
        display: inline-block;
      }
      .project-card {
        margin-bottom: 1.5rem;
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-100 h-full flex flex-col">
    <header class="bg-gray-800 shadow p-6 text-center">
      <h1 class="text-3xl font-bold">Tobias Andersson</h1>
      <p class="text-lg text-gray-400">Software Developer with Optimizely experience</p>
    </header>

    <main class="p-6 max-w-7xl mx-auto flex-grow">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <aside class="md:col-span-2 bg-gray-800 rounded-xl p-6 h-fit">
          <h2 class="text-xl font-semibold mb-4">About My Work</h2>
          <p class="text-sm text-gray-300">
            Here you can describe your development philosophy, current areas of interest, or anything else you want visitors to know about your work.
          </p>

          <div class="max-w-md mx-auto mt-10 p-6 bg-gray-800 text-gray-100 rounded-lg shadow">
            <h2 class="text-xl font-semibold mb-4 text-center">GUID Generator</h2>

            <div class="flex flex-col gap-4">
              <input
                type="text"
                id="guid-output"
                readonly
                class="w-full px-4 py-2 border rounded text-gray-800 bg-gray-100"
                placeholder="Click 'Generate' to create a GUID"
              />

              <div class="flex gap-4">
                <button
                  onclick="generateGUID()"
                  class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2 rounded"
                >
                  Generate
                </button>
                <button
                  onclick="copyToClipboard()"
                  class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-2 rounded"
                >
                  Copy
                </button>
              </div>

              <p id="copy-status" class="text-sm text-green-600 text-center hidden">Copied!</p>
            </div>
          </div>
        </aside>

        <section class="md:col-span-1">
          <h2 class="text-2xl font-semibold mb-4">Projects</h2>
          <div class="bg-gray-800 rounded-xl max-h-[500px] overflow-y-auto p-4 custom-scroll">
            <div id="projects-container"></div>
          </div>
        </section>
      </div>
    </main>

    <footer class="bg-gray-800 shadow-inner p-6 text-center">
      <div class="flex justify-center gap-6 mb-2">
        <a href="#" class="text-blue-400 hover:underline">LinkedIn</a>
        <a href="weather.html" class="text-blue-400 hover:underline">Weather</a>
        <a href="mailto:tumskruven@gmail.com" class="text-blue-400 hover:underline">Email</a>
      </div>
      <p class="text-sm text-gray-500">
        &copy; <span id="current-year"></span> Tobias Andersson
      </p>
    </footer>

    <script>
      document.getElementById("current-year").textContent = new Date().getFullYear();

      async function fetchAllPublicRepos(username) {
        const excludeList = ["t0883", "t0883.github.io", "recipes", "OOAnalysOODesign", "OOAnalysLectureProject", "Inlamning-Webbapp", "inlamning-2" ,"InlamingsUppgiftDBKurs", "Clean-API-Cars", "Github-Repo-Template", "Inl-mningOOPGrund", "Passord"];
        const cacheKey = `github_repos_cache_${username}`;
        const cacheTimeKey = `${cacheKey}_timestamp`;
        const oneHour = 60 * 60 * 1000;

        const now = new Date().getTime();
        const cachedData = localStorage.getItem(cacheKey);
        const cachedTime = localStorage.getItem(cacheTimeKey);

        if (cachedData && cachedTime && now - cachedTime < oneHour) {
          renderProjects(JSON.parse(cachedData), excludeList);
          return;
        }

        try {
          const reposRes = await fetch(`https://api.github.com/users/${username}/repos`);
          if (!reposRes.ok) throw new Error("Failed to fetch repositories.");

          const repos = await reposRes.json();
          const enrichedRepos = [];

          for (const repo of repos) {
            if (excludeList.includes(repo.name)) continue;

            const langRes = await fetch(repo.languages_url);
            const languages = langRes.ok ? await langRes.json() : {};
            enrichedRepos.push({ ...repo, languages });
          }

          localStorage.setItem(cacheKey, JSON.stringify(enrichedRepos));
          localStorage.setItem(cacheTimeKey, now);
          renderProjects(enrichedRepos, excludeList);
        } catch (error) {
          console.error("Error loading repositories:", error);
        }
      }

      function generateGUID() {
        const guid = ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
          (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
        );
        document.getElementById("guid-output").value = guid;
        document.getElementById("copy-status").classList.add("hidden");
      }

      function copyToClipboard() {
        const output = document.getElementById("guid-output");
        output.select();
        output.setSelectionRange(0, 99999); // for mobile support
        document.execCommand("copy");

        // Optional: Show feedback
        const status = document.getElementById("copy-status");
        status.classList.remove("hidden");
        setTimeout(() => status.classList.add("hidden"), 1500);
      }

      function renderProjects(repos, excludeList) {
        const container = document.getElementById("projects-container");
        container.innerHTML = "";

        repos.forEach(repo => {
          if (excludeList.includes(repo.name)) return;

          const card = document.createElement("div");
          card.className = "project-card bg-gray-700 rounded-xl shadow p-5 hover:shadow-md transition";

          const tagsHTML = Object.keys(repo.languages || {})
            .map(lang => `<span class='tag'>${lang}</span>`)
            .join("");

          card.innerHTML = `
            <div class="flex items-center gap-4 mb-4">
              <img src="https://img.icons8.com/ios/50/source-code.png" alt="icon" class="w-10 h-10" />
              <div>
                <h3 class="text-xl font-semibold">${repo.name}</h3>
                <div class="flex flex-wrap gap-2 mt-1">${tagsHTML}</div>
              </div>
            </div>
            <p class="text-sm text-gray-300 mb-4">${repo.description || "No description available."}</p>
            <a href="${repo.html_url}" class="text-blue-400 hover:underline">View on GitHub</a>
          `;

          container.appendChild(card);
        });
      }

      fetchAllPublicRepos("t0883");
    </script>
  </body>
</html>
